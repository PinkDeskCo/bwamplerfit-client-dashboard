<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="referrer" content="no-referrer">

    <title>Reset Password | BWamplerFit</title>

    <link
        rel="stylesheet"
        href="./assets/css/challenge.css"
    >
</head>

<body>
    <main class="challenge-page">
        <section class="challenge-auth">
            <div class="challenge-auth__card">

                <p class="challenge-auth__eyebrow">
                    BWamplerFit Account
                </p>

                <h1 class="challenge-auth__title">
                    Set your new password.
                </h1>

                <p id="reset-status" role="status">
                    Checking your reset link…
                </p>

                <form
                    id="reset-password-form"
                    class="challenge-auth__form"
                    hidden
                >
                    <label
                        class="challenge-auth__label"
                        for="reset-password"
                    >
                        New password
                    </label>

                    <input
                        class="challenge-auth__input"
                        id="reset-password"
                        type="password"
                        autocomplete="new-password"
                        minlength="12"
                        required
                    >

                    <label
                        class="challenge-auth__label"
                        for="reset-password-confirm"
                    >
                        Confirm new password
                    </label>

                    <input
                        class="challenge-auth__input"
                        id="reset-password-confirm"
                        type="password"
                        autocomplete="new-password"
                        minlength="12"
                        required
                        aria-describedby="reset-password-match"
                        aria-invalid="false"
                    >

                    <p
                        id="reset-password-match"
                        role="status"
                        style="margin:0;text-align:left;font-weight:600"
                    ></p>

                    <label
                        style="display:flex;align-items:center;gap:10px;
                            min-height:44px;cursor:pointer"
                    >
                        <input
                            id="reset-show-passwords"
                            type="checkbox"
                            style="width:20px;height:20px;margin:0"
                        >
                        Show passwords
                    </label>

                    <p>Use at least 12 characters.</p>

                    <button
                        class="challenge-auth__button"
                        id="reset-password-submit"
                        type="submit"
                    >
                        Save new password
                    </button>
                </form>

                <p>
                    <a href="./index.html">Return to sign in</a>
                </p>

            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./assets/js/supabase-config.js"></script>
    <script src="./assets/js/password-recovery.js"></script>
</body>
</html>
